name: CD — Deploy to AWS EKS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target EKS environment"
        required: true
        default: "prod"
        type: choice
        options:
          - staging
          - prod

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1
  EKS_CLUSTER_NAME: ticketflow-${{ inputs.environment || 'prod' }}

jobs:
  deploy:
    name: Build, Push to ECR & Helm Upgrade on EKS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update kubeconfig for Amazon EKS
        run: aws eks update-kubeconfig --region "${AWS_REGION}" --name "${EKS_CLUSTER_NAME}"

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Deploy TicketFlow Helm Release
        run: |
          helm upgrade --install ticketflow ./helm/ticketflow \
            --namespace ticketflow \
            --create-namespace \
            -f ./helm/ticketflow/values-prod.yaml \
            --set imageRegistry="${{ steps.login-ecr.outputs.registry }}/ticketflow" \
            --set imageTag="${{ github.sha }}" \
            --wait --timeout 5m
