services:
  postgres:
    image: postgres:16-alpine
    container_name: ticketflow-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ticketflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticketflow_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ticketflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ticketflow-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ticketflow-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ticketflow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-ticketflow_secret}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: ticketflow-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  auth-service:
    build: ./services/auth-service
    image: ticketflow/auth-service:local
    container_name: ticketflow-auth
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      DB_USER: ${POSTGRES_USER:-ticketflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ticketflow_secret}
      COOKIE_SECURE: "false"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  event-service:
    build: ./services/event-service
    image: ticketflow/event-service:local
    container_name: ticketflow-event
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/event_db
      DB_USER: ${POSTGRES_USER:-ticketflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ticketflow_secret}
      JWKS_URI: http://auth-service:8081/.well-known/jwks.json
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  booking-service:
    build: ./services/booking-service
    image: ticketflow/booking-service:local
    container_name: ticketflow-booking
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/booking_db
      DB_USER: ${POSTGRES_USER:-ticketflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ticketflow_secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-ticketflow}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-ticketflow_secret}
      JWKS_URI: http://auth-service:8081/.well-known/jwks.json
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  payment-service:
    build: ./services/payment-service
    image: ticketflow/payment-service:local
    container_name: ticketflow-payment
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_db
      DB_USER: ${POSTGRES_USER:-ticketflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ticketflow_secret}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-ticketflow}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-ticketflow_secret}
      JWKS_URI: http://auth-service:8081/.well-known/jwks.json
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  notification-service:
    build: ./services/notification-service
    image: ticketflow/notification-service:local
    container_name: ticketflow-notification
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-ticketflow}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-ticketflow_secret}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      JWKS_URI: http://auth-service:8081/.well-known/jwks.json
    ports:
      - "8085:8085"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  api-gateway:
    build: ./services/api-gateway
    image: ticketflow/api-gateway:local
    container_name: ticketflow-gateway
    environment:
      JWKS_URI: http://auth-service:8081/.well-known/jwks.json
      AUTH_SERVICE_URL: http://auth-service:8081
      EVENT_SERVICE_URL: http://event-service:8082
      BOOKING_SERVICE_URL: http://booking-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
    ports:
      - "8080:8080"
    depends_on:
      auth-service:
        condition: service_healthy
      event-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    build: ./frontend/ticketflow-ui
    image: ticketflow/frontend:local
    container_name: ticketflow-frontend
    environment:
      API_URL: ${API_URL:-/api}
      KEYCLOAK_ISSUER: ticketflow-auth
    ports:
      - "4200:8080"
      - "80:8080"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ticketflow-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api-gateway

  grafana:
    image: grafana/grafana:11.2.0
    container_name: ticketflow-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-ticketflow}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
