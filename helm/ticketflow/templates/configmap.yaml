apiVersion: v1
kind: ConfigMap
metadata:
  name: ticketflow-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ticketflow.labels" . | nindent 4 }}
data:
  JWKS_URI: "http://auth-service:8081/.well-known/jwks.json"
  AUTH_SERVICE_URL: "http://auth-service:8081"
  EVENT_SERVICE_URL: "http://event-service:8082"
  BOOKING_SERVICE_URL: "http://booking-service:8083"
  PAYMENT_SERVICE_URL: "http://payment-service:8084"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8085"
  REDIS_HOST: {{ .Values.config.redisHost | quote }}
  REDIS_PORT: {{ .Values.config.redisPort | quote }}
  RABBITMQ_HOST: {{ .Values.config.rabbitmqHost | quote }}
  RABBITMQ_PORT: {{ .Values.config.rabbitmqPort | quote }}
  SEAT_HOLD_TTL_SECONDS: {{ .Values.config.seatHoldTtlSeconds | quote }}
  API_URL: {{ .Values.config.apiUrl | quote }}
