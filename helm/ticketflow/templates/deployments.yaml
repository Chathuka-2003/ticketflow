apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ticketflow.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.services.bookingService.replicas }}
  selector:
    matchLabels:
      app: booking-service
  template:
    metadata:
      labels:
        app: booking-service
    spec:
      containers:
        - name: booking-service
          image: "{{ .Values.imageRegistry }}/booking-service:{{ .Values.imageTag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.services.bookingService.port }}
          envFrom:
            - configMapRef:
                name: ticketflow-config
            - secretRef:
                name: ticketflow-secrets
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.services.bookingService.port }}
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: booking-service
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: booking-service
  ports:
    - port: {{ .Values.services.bookingService.port }}
      targetPort: {{ .Values.services.bookingService.port }}
