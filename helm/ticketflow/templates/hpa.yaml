apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: booking-service-hpa
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ticketflow.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: booking-service
  minReplicas: {{ .Values.services.bookingService.hpa.minReplicas }}
  maxReplicas: {{ .Values.services.bookingService.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.services.bookingService.hpa.targetCpuUtilization }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: event-service-hpa
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ticketflow.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: event-service
  minReplicas: {{ .Values.services.eventService.hpa.minReplicas }}
  maxReplicas: {{ .Values.services.eventService.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.services.eventService.hpa.targetCpuUtilization }}
