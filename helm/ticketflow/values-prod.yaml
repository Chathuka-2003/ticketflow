namespace: ticketflow

imageRegistry: 123456789012.dkr.ecr.ap-southeast-1.amazonaws.com/ticketflow
imageTag: "1.0.0"
imagePullPolicy: Always

config:
  redisHost: ticketflow-prod-redis.abc123.ng.0001.apse1.cache.amazonaws.com
  redisPort: "6379"
  rabbitmqHost: b-987654-1.mq.ap-southeast-1.amazonaws.com
  rabbitmqPort: "5671"
  seatHoldTtlSeconds: "600"
  apiUrl: "/api"

services:
  authService:
    port: 8081
    replicas: 2
  eventService:
    port: 8082
    replicas: 3
    hpa:
      enabled: true
      minReplicas: 3
      maxReplicas: 12
      targetCpuUtilization: 65
  bookingService:
    port: 8083
    replicas: 3
    hpa:
      enabled: true
      minReplicas: 3
      maxReplicas: 20
      targetCpuUtilization: 60
  paymentService:
    port: 8084
    replicas: 2
  notificationService:
    port: 8085
    replicas: 2
  apiGateway:
    port: 8080
    replicas: 3
  frontend:
    port: 8080
    replicas: 3

ingress:
  enabled: true
  className: alb
  host: tickets.ticketflow.io
