namespace: ticketflow

imageRegistry: ticketflow
imageTag: local
imagePullPolicy: IfNotPresent

config:
  redisHost: redis
  redisPort: "6379"
  rabbitmqHost: rabbitmq
  rabbitmqPort: "5672"
  seatHoldTtlSeconds: "600"
  apiUrl: "/api"

services:
  authService:
    port: 8081
    replicas: 1
  eventService:
    port: 8082
    replicas: 2
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCpuUtilization: 70
  bookingService:
    port: 8083
    replicas: 2
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      targetCpuUtilization: 65
  paymentService:
    port: 8084
    replicas: 1
  notificationService:
    port: 8085
    replicas: 1
  apiGateway:
    port: 8080
    replicas: 2
  frontend:
    port: 8080
    replicas: 2

ingress:
  enabled: true
  className: nginx
  host: ticketflow.local
