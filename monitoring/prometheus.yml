global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alert-rules.yml"

scrape_configs:
  - job_name: "ticketflow-microservices"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - "api-gateway:8080"
          - "auth-service:8081"
          - "event-service:8082"
          - "booking-service:8083"
          - "payment-service:8084"
          - "notification-service:8085"
        labels:
          platform: "ticketflow"
          environment: "local-docker"
